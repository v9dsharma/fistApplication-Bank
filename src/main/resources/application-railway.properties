# Activate with SPRING_PROFILES_ACTIVE=railway on the backend service.
# Set MYSQL* variables using references to the Railway MySQL service.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT:3316}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.springframework.security=INFO
